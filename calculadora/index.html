<!DOCTYPE html>
<html lang="es" class="js-loaded">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de materiales para pisos de hormigón — NewConcret</title>
<meta name="description" content="Calculá en segundos los materiales para tu obra de hormigón: fibras, endurecedor, curador, juntas y más. Herramienta técnica gratuita de NewConcret.">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" type="image/x-icon" href="../logos/Favicon.ico">
<link rel="stylesheet" href="../assets/css/estilo.css?v=43">
<link rel="stylesheet" href="../assets/css/nav.css?v=2.0">
<style>
  /* ══════════════════════════════════════════════════════════
     CALCULADORA DE MATERIALES — hoja de estilo de página
     Usa los tokens de marca (estilo.css). Prefijo cl- para aislar.
     ══════════════════════════════════════════════════════════ */

  body { background: var(--nc-black); color: var(--nc-white); font-family: var(--font-b); overflow-x: hidden; }
  body:not(.js-loaded) { cursor: auto !important; }
  .js-loaded body { cursor: none; }
  @media (pointer: coarse) { #cur, #ring { display: none; } body, body * { cursor: auto !important; } }
  #cur, #ring { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 20000; border-radius: 50%; transform: translate(-50%, -50%); transition: opacity .3s; }
  #cur { width: 6px; height: 6px; background: var(--nc-red); }
  #ring { width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.2); }

  /* Rampa de superficies. Las tarjetas del sitio se apoyan en la foto del
     producto para despegarse del fondo; acá el contenido es texto plano,
     asi que la separacion la tienen que hacer el tono y el borde. */
  .cl {
    --pad: clamp(1.25rem, 5vw, 6rem);
    --cl-bg: var(--nc-black);      /* fondo de pagina  #0A0A0A */
    --cl-surf: #1A1B1E;            /* tarjetas y paneles        */
    --cl-surf-up: #232529;         /* hover / elevado           */
    --cl-well: #0C0C0D;            /* campos hundidos           */
    --cl-edge: #41444A;            /* bordes y separadores      */
    --cl-edge-soft: #2C2E32;       /* divisiones internas       */
    /* filo superior: define el canto de cada tarjeta contra el fondo */
    --cl-lift: inset 0 1px 0 rgba(255,255,255,.055);
  }
  .cl-wrap { max-width: 1400px; margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); }

  /* ── Reveal ── */
  .cl-reveal { opacity: 0; transform: translateY(26px); transition: opacity .85s var(--expo), transform .85s var(--expo); transition-delay: calc(var(--i, 0) * 85ms); }
  .cl-reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .cl-reveal { opacity: 1 !important; transform: none !important; transition: none; }
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ── Eyebrow ── */
  .cl-eyebrow { display: inline-flex; align-items: center; gap: .85rem; font-family: var(--font-m); font-size: .6rem; text-transform: uppercase; letter-spacing: .28em; color: var(--nc-red-hot); font-weight: 500; }
  .cl-eyebrow::before { content: ''; width: 22px; height: 1px; background: var(--nc-red); display: inline-block; }

  /* ── Botones ── */
  .cl-btn { font-family: var(--font-d); font-weight: 700; font-size: .82rem; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; border: none; padding: 1.05rem 2rem; display: inline-flex; align-items: center; justify-content: center; gap: .7rem; transition: transform .2s, color .2s, border-color .2s, background .2s; }
  .cl-btn svg { width: 15px; height: 15px; flex: none; }
  .cl-btn:active { transform: scale(.985); }
  .cl-btn-p { position: relative; overflow: hidden; background: var(--nc-red); color: #fff; clip-path: polygon(0 0, 100% 0, 100% 70%, 94% 100%, 0 100%); }
  .cl-btn-p::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent); transition: left .5s; }
  .cl-btn-p:hover::before { left: 100%; }
  .cl-btn-p:hover { background: var(--nc-red-hot); transform: translateY(-2px); }
  .cl-btn-g { font-weight: 600; font-size: .72rem; letter-spacing: .16em; color: var(--nc-light); background: transparent; border: 1px solid var(--nc-steel-2); padding: .95rem 1.5rem; }
  .cl-btn-g:hover { color: #fff; border-color: var(--nc-ash); background: rgba(255,255,255,.06); }
  .cl-btn-wa { background: transparent; color: var(--nc-white); border: 1px solid var(--nc-steel-2); font-weight: 600; font-size: .72rem; letter-spacing: .16em; padding: .95rem 1.5rem; }
  .cl-btn-wa:hover { border-color: var(--nc-red); color: #fff; background: rgba(193,18,31,.12); }

  /* ═══ HERRAMIENTA ═══ */
  /* Sin hero: la página arranca directamente en la calculadora. */
  .cl-tool { padding: calc(68px + clamp(1.6rem, 4vw, 2.8rem)) 0 clamp(4rem, 9vw, 7rem); scroll-margin-top: 80px; }
  @media (max-width: 900px) { .cl-tool { padding-top: calc(66px + 1.4rem); } }

  /* Encabezado compacto del menú */
  .cl-mast { padding-bottom: 1.6rem; margin-bottom: 2rem; border-bottom: 1px solid var(--cl-edge-soft); }
  .cl-mast-h1 { font-family: var(--font-d); font-weight: 900; font-size: clamp(2.1rem, 5vw, 3.4rem); line-height: .95; letter-spacing: -.015em; text-transform: uppercase; color: var(--nc-white); margin: .8rem 0 0; }
  .cl-mast-h1 .red { color: var(--nc-red-hot); }
  .cl-mast-p { max-width: 640px; margin-top: .9rem; font-size: .96rem; line-height: 1.6; color: var(--nc-light); font-weight: 400; }

  /* Barra de módulo (sticky) */
  .cl-bar { display: flex; align-items: center; gap: 1rem; padding: 1rem 0 1.1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--cl-edge-soft); position: sticky; top: 68px; z-index: 40; background: var(--cl-bg); }
  .cl-bar-back { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none; background: transparent; border: 1px solid var(--nc-steel-2); color: var(--nc-light); transition: .2s; }
  .cl-bar-back:hover { border-color: var(--nc-red); color: #fff; background: rgba(193,18,31,.12); }
  .cl-bar-txt { min-width: 0; }
  .cl-bar-k { font-family: var(--font-m); font-size: .58rem; letter-spacing: .26em; text-transform: uppercase; color: var(--nc-red-hot); }
  .cl-bar-t { font-family: var(--font-d); font-weight: 900; font-size: clamp(1.3rem, 3vw, 1.9rem); text-transform: uppercase; letter-spacing: -.01em; line-height: 1.1; margin-top: .2rem; }
  .cl-bar-n { margin-left: auto; font-family: var(--font-d); font-weight: 900; font-size: clamp(1.6rem, 4vw, 2.4rem); color: var(--nc-mid); letter-spacing: .02em; }

  /* Módulos del menú */
  /* Las tarjetas se separan y cada una lleva su propio contorno, en vez
     del bloque continuo cosido con un hairline de 1px. */
  .cl-mods { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
  .cl-mod { position: relative; display: flex; flex-direction: column; gap: 1.4rem; background: var(--cl-surf); border: 1px solid var(--cl-edge); padding: 2.2rem 1.9rem 2rem; text-align: left; color: inherit; font: inherit; transition: background .3s var(--expo), border-color .25s; overflow: hidden; box-shadow: var(--cl-lift); }
  .cl-mod:hover { border-color: var(--nc-red); }
  .cl-mod::after { content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 2px; background: var(--nc-red); transform: scaleY(0); transform-origin: top; transition: transform .45s var(--expo); }
  .cl-mod:hover { background: var(--cl-surf-up); }
  .cl-mod:hover::after { transform: scaleY(1); }
  .cl-mod-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  .cl-mod-ico { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--nc-steel-2); color: var(--nc-red-hot); transition: .3s; }
  .cl-mod-ico svg { width: 24px; height: 24px; }
  .cl-mod:hover .cl-mod-ico { border-color: var(--nc-red); background: rgba(193,18,31,.1); }
  .cl-mod-n { font-family: var(--font-d); font-weight: 900; font-size: 1.5rem; color: var(--nc-mid); transition: color .3s; }
  .cl-mod:hover .cl-mod-n { color: var(--nc-ash); }
  .cl-mod-t { font-family: var(--font-d); font-weight: 700; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .01em; line-height: 1.1; }
  .cl-mod-d { font-size: .9rem; line-height: 1.6; color: var(--nc-light); font-weight: 400; margin-top: .6rem; }
  .cl-mod-go { display: inline-flex; align-items: center; gap: .6rem; margin-top: auto; padding-top: 1.2rem; font-family: var(--font-d); font-weight: 700; font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--nc-light); }
  .cl-mod-go svg { width: 13px; height: 13px; transition: transform .3s var(--expo); }
  .cl-mod:hover .cl-mod-go { color: var(--nc-red-hot); }
  .cl-mod:hover .cl-mod-go svg { transform: translateX(5px); }
  .cl-mod-tag { display: inline-flex; align-items: center; gap: .45rem; align-self: flex-start; font-family: var(--font-m); font-size: .56rem; letter-spacing: .2em; text-transform: uppercase; color: var(--nc-red-hot); border: 1px solid rgba(193,18,31,.4); padding: .35rem .6rem; }

  /* Grilla de formulario */
  /* align-items:start para que cada panel mida lo que ocupa su contenido.
     Estirados a la altura del mas alto, a los cortos les quedaban 166px
     de vacio abajo. Las tarjetas de resultado si se estiran, porque ahi
     el estirado alinea los botones al pie de cada una. */
  .cl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; align-items: start; }
  .cl-grid--duo { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .cl-panel { background: var(--cl-surf); border: 1px solid var(--cl-edge); padding: 1.9rem 1.7rem; box-shadow: var(--cl-lift); }
  .cl-panel--wide { grid-column: 1 / -1; }
  @media (min-width: 1100px) { .cl-grid--main { grid-template-columns: 1.35fr 1fr 1fr; } .cl-grid--main .cl-panel--wide { grid-column: span 1; } }

  .cl-panel-h { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 1.5rem; padding-bottom: .9rem; border-bottom: 1px solid var(--cl-edge-soft); }
  .cl-panel-h i { font-family: var(--font-m); font-style: normal; font-size: .62rem; letter-spacing: .2em; color: var(--nc-red); }
  .cl-panel-h span { font-family: var(--font-d); font-weight: 700; font-size: .9rem; letter-spacing: .16em; text-transform: uppercase; color: var(--nc-white); }

  /* Campos */
  .cl-lbl { display: block; font-family: var(--font-m); font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; color: var(--nc-light); margin-bottom: .55rem; }
  .cl-inp-w { position: relative; margin-bottom: 1.1rem; }
  .cl-inp-w:last-child { margin-bottom: 0; }
  .cl-inp-w input { width: 100%; background: var(--cl-well); color: #fff; border: 1px solid var(--nc-steel-2); padding: .95rem 4.4rem .95rem 1rem; font-family: var(--font-m); font-size: 1.15rem; font-weight: 500; letter-spacing: .01em; outline: none; transition: border-color .2s, background .2s; -moz-appearance: textfield; }
  .cl-inp-w input::-webkit-outer-spin-button, .cl-inp-w input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .cl-inp-w input::placeholder { color: #6E6E6E; font-weight: 400; }
  .cl-inp-w input:focus { border-color: var(--nc-red); background: #0d0d0d; }
  .cl-inp-w .u { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); font-family: var(--font-m); font-size: .74rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--nc-light); pointer-events: none; }

  /* Bloque excluyente espesor / m³ */
  .cl-excl { border: 1px solid var(--cl-edge); background: rgba(0,0,0,.35); padding: 1.2rem; margin-top: 1.4rem; }
  .cl-excl-h { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .cl-excl-h .t { font-family: var(--font-d); font-weight: 700; font-size: .74rem; letter-spacing: .18em; text-transform: uppercase; color: var(--nc-white); }
  .cl-excl-h .h { font-size: .78rem; color: var(--nc-ash); font-weight: 400; }
  .cl-excl-row { display: flex; align-items: stretch; gap: .9rem; }
  .cl-excl-c { flex: 1; min-width: 0; }
  .cl-excl-c .cap { display: flex; align-items: center; gap: .5rem; min-height: 20px; margin-bottom: .55rem; }
  .cl-excl-c .cap .n { font-family: var(--font-m); font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; color: var(--nc-light); }
  .cl-excl-c .cl-inp-w { margin-bottom: 0; }
  .cl-auto { display: none; font-family: var(--font-m); font-size: .52rem; letter-spacing: .18em; text-transform: uppercase; color: var(--nc-red-hot); border: 1px solid rgba(193,18,31,.45); padding: .15rem .4rem; }
  .cl-excl-c.is-auto .cl-auto { display: inline-block; }
  .cl-excl-c.is-auto input { background: rgba(193,18,31,.08); border-color: rgba(193,18,31,.35); color: var(--nc-white); cursor: default; }
  .cl-excl-or { align-self: center; flex: none; width: 34px; height: 34px; margin-top: 1.6rem; display: flex; align-items: center; justify-content: center; font-family: var(--font-d); font-weight: 700; font-size: .68rem; letter-spacing: .12em; color: var(--nc-light); border: 1px solid var(--cl-edge); }
  .cl-excl-note { display: none; align-items: center; gap: .5rem; margin-top: .9rem; font-size: .78rem; color: #E8A33D; font-weight: 300; }
  .cl-excl-note.show { display: flex; }

  /* Opciones */
  .cl-opt { display: flex; align-items: center; gap: .8rem; border: 1px solid var(--cl-edge-soft); background: var(--cl-well); padding: .85rem .9rem; margin-bottom: .6rem; transition: border-color .2s, background .2s; }
  .cl-opt:last-of-type { margin-bottom: 0; }
  .cl-opt:hover { border-color: var(--cl-edge); background: #121315; }
  .cl-opt:has(input:checked) { border-color: rgba(193,18,31,.5); background: rgba(193,18,31,.08); }
  .cl-opt-lb { display: flex; align-items: center; gap: .8rem; flex: 1; min-width: 0; cursor: pointer; }
  .cl-opt input[type=checkbox] { appearance: none; -webkit-appearance: none; position: relative; width: 20px; height: 20px; flex: none; border: 1px solid var(--cl-edge); background: var(--cl-well); cursor: pointer; transition: .2s; }
  .cl-opt input[type=checkbox]:checked { background: var(--nc-red); border-color: var(--nc-red); }
  .cl-opt input[type=checkbox]:checked::after { content: ''; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .cl-opt-t { font-family: var(--font-d); font-weight: 700; font-size: .95rem; letter-spacing: .05em; text-transform: uppercase; }
  .cl-info { flex: none; background: none; border: none; color: var(--nc-light); font-family: var(--font-m); font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; padding: .4rem .5rem; display: inline-flex; align-items: center; gap: .35rem; transition: color .2s; }
  .cl-info svg { width: 13px; height: 13px; }
  .cl-info:hover { color: var(--nc-red-hot); }

  .cl-sub { border-left: 1px solid rgba(193,18,31,.4); padding: 1.1rem 0 .2rem 1.1rem; margin: .9rem 0 .2rem .35rem; }

  /* Acciones */
  .cl-acts { display: flex; flex-wrap: wrap; gap: .9rem; margin-top: 1.8rem; }
  .cl-note { font-size: .82rem; color: var(--nc-ash); font-weight: 400; line-height: 1.65; margin-top: 1.4rem; max-width: 720px; }

  /* Resumen */
  .cl-chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 2rem; }
  .cl-chip { background: var(--cl-surf); border: 1px solid var(--cl-edge); padding: 1.2rem 1.3rem; box-shadow: var(--cl-lift); }
  .cl-chip .k { font-family: var(--font-m); font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--nc-light); }
  .cl-chip .v { font-family: var(--font-d); font-weight: 900; font-size: 1.9rem; line-height: 1.1; margin-top: .35rem; letter-spacing: -.01em; color: #fff; }
  .cl-chip .v small { font-family: var(--font-m); font-weight: 500; font-size: .76rem; color: var(--nc-light); margin-left: .3rem; letter-spacing: .1em; text-transform: uppercase; }

  /* Resultados */
  .cl-sec-h { display: flex; align-items: center; gap: .85rem; font-family: var(--font-m); font-size: .64rem; letter-spacing: .26em; text-transform: uppercase; color: var(--nc-light); margin: 0 0 1.2rem; }
  .cl-sec-h::before { content: ''; width: 22px; height: 1px; background: var(--nc-red); }
  .cl-res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; }
  .cl-res { position: relative; background: var(--cl-surf); border: 1px solid var(--cl-edge); padding: 1.8rem 1.7rem; display: flex; flex-direction: column; box-shadow: var(--cl-lift); transition: border-color .25s; }
  .cl-res:hover { border-color: var(--nc-red); }
  .cl-res::after { content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 2px; background: var(--nc-red); }
  .cl-res-n { font-family: var(--font-m); font-size: .62rem; letter-spacing: .22em; color: var(--nc-ash); margin-bottom: .5rem; }
  .cl-res-t { font-family: var(--font-d); font-weight: 700; font-size: .95rem; letter-spacing: .13em; text-transform: uppercase; color: #fff; margin-bottom: .9rem; }
  .cl-res-v { font-family: var(--font-d); font-weight: 900; font-size: 1.85rem; line-height: 1.15; letter-spacing: -.01em; color: #fff; }
  .cl-res-s { font-size: .9rem; line-height: 1.6; color: var(--nc-light); font-weight: 400; margin-top: .5rem; }
  .cl-res-acts { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; margin-top: auto; padding-top: 1.4rem; }
  .cl-res-buy { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: .55rem; background: var(--nc-red); color: #fff; font-family: var(--font-d); font-weight: 700; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; padding: .75rem 1.15rem; clip-path: polygon(0 0, 100% 0, 100% 68%, 91% 100%, 0 100%); transition: background .2s, transform .2s; }
  .cl-res-buy svg { width: 14px; height: 14px; flex: none; }
  .cl-res-buy::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); transition: left .5s; }
  .cl-res-buy:hover::before { left: 100%; }
  .cl-res-buy:hover { background: var(--nc-red-hot); transform: translateY(-2px); }
  /* Dentro del resultado la ficha es un boton, a la par de Comprar */
  .cl-res .cl-info { margin: 0; padding: .72rem 1.05rem; border: 1px solid var(--nc-steel-2); color: var(--nc-white); font-size: .68rem; transition: border-color .2s, background .2s, color .2s; }
  .cl-res .cl-info:hover { border-color: var(--nc-ash); background: rgba(255,255,255,.06); color: #fff; }


  /* Modal ficha técnica */
  .cl-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.82); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 9000; padding: 1.25rem; }
  .cl-modal-bg.open { display: flex; }
  .cl-modal { background: var(--cl-surf); border: 1px solid var(--cl-edge); border-left: 2px solid var(--nc-red); max-width: 560px; width: 100%; max-height: 82vh; overflow-y: auto; }
  .cl-modal-h { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: 1.1rem 1.4rem; background: var(--cl-surf); border-bottom: 1px solid var(--cl-edge-soft); }
  .cl-modal-h span { font-family: var(--font-m); font-size: .6rem; letter-spacing: .26em; text-transform: uppercase; color: var(--nc-red-hot); }
  .cl-modal-x { background: none; border: 1px solid var(--nc-steel-2); color: var(--nc-light); font-family: var(--font-d); font-weight: 700; font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; padding: .5rem .9rem; transition: .2s; }
  .cl-modal-x:hover { border-color: var(--nc-red); color: #fff; }
  .cl-modal-body { padding: 1.5rem 1.4rem .2rem; }
  .cl-modal-name { font-family: var(--font-d); font-weight: 900; font-size: 1.5rem; line-height: 1.1; letter-spacing: -.01em; text-transform: uppercase; color: #fff; }
  .cl-modal-desc { font-family: var(--font-b); font-size: .95rem; line-height: 1.7; color: var(--nc-light); font-weight: 400; margin: .8rem 0 0; }
  .cl-modal-foot { padding: 1.4rem 1.4rem 1.5rem; }
  .cl-modal-pdf { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: .6rem; background: var(--nc-red); color: #fff; font-family: var(--font-d); font-weight: 700; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; padding: .85rem 1.3rem; clip-path: polygon(0 0, 100% 0, 100% 68%, 93% 100%, 0 100%); transition: background .2s, transform .2s; }
  .cl-modal-pdf svg { width: 15px; height: 15px; flex: none; }
  .cl-modal-pdf::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); transition: left .5s; }
  .cl-modal-pdf:hover::before { left: 100%; }

<script>
(function () {
  'use strict';


  // ────────────────────────────────────────────────────────────────

  function closeInfo() { modalBg.classList.remove('open'); }

  document.getElementById('clModalX').addEventListener('click', closeInfo);
  modalBg.addEventListener('click', function (e) { if (e.target === modalBg) closeInfo(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeInfo(); });

  var toastTimer;

    var t = document.getElementById('clToast');

    t.classList.add('show');

    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  var ICO_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg>';

  function infoBtn(key, label) {
    return '<button class="cl-info" type="button" data-info="' + key + '">' + ICO_INFO + (label || 'Ficha') + '</button>';
  }

  // ── Datos del producto (tienda y ficha técnica) ──────────────────
  // El SKU es la clave; la tienda y el PDF salen de
  // assets/data/productos.js, que es la única fuente de verdad. Si el
  // producto no está o le falta el dato, no se muestra ese enlace.
  var STORE_SKU = {
    nylon: 'NYLONNEGRO',
    macrofibra: 'CONCRETFIBRA',
    microfibra: 'CONCRETMICRO',
    dur: 'CONCRETDUR',
    one: 'CONCRETONE',
    scudo: 'CONCRETSCUDO',
    juntas: 'SELLADORPOLIURETNICO',
    sodium: 'CONCRETSODIUM',
    lock: 'CONCRETLOCK',
    finish: 'CONCRETFINISH',
    fix: 'CONCRETFIX',
    microstrong: 'CONCRETMICROSTRONG'
  };

  var ICO_CART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3h2.2l2.3 11.2a1.6 1.6 0 001.6 1.3h8.6a1.6 1.6 0 001.6-1.3L20.5 7H6"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/></svg>';

  function productField(key, field) {
    var sku = STORE_SKU[key];
    if (!sku || typeof productos === 'undefined') return '';
    for (var i = 0; i < productos.length; i++) {
      if (productos[i].sku === sku && productos[i].visible !== false && productos[i][field]) {
        return productos[i][field];
      }
    }
    return '';
  }

  function buyBtn(key) {
    var url = productField(key, 'storeUrl');
    if (!url) return '';
    return '<a class="cl-res-buy" href="' + url + '" target="_blank" rel="noopener">' + ICO_CART + 'Comprar</a>';
  }

  // número lindo: hasta 2 decimales, sin ceros colgando, coma decimal
  function num(v, dec) {
    if (v === null || v === undefined || isNaN(v)) return '';
    var d = dec === undefined ? 2 : dec;
    return parseFloat(v.toFixed(d)).toString().replace('.', ',');
  }

  // "1 litro" / "2 litros". Con superficies chicas salia "1 litros",
  // y "1 bolsa(s)" quedaba con el plural entre parentesis al pedo.
  // Acepta el numero o ya formateado por num() ("6,7").
  function plural(n, sing, plur) {
    var v = typeof n === 'number' ? n : parseFloat(String(n).replace(',', '.'));
    return n + ' ' + (Math.abs(v) === 1 ? sing : (plur || sing + 's'));
  }

  // Los liquidos se muestran con un decimal en vez de redondeados: con
  // Math.round, 1 m² de Sodium daba "0 litros" mientras la linea de
  // abajo pedia un bidon, y en el otro sentido 110 m² de One redondeaba
  // 7,3 a 7 y quedaba corto. La cantidad a comprar la sigue diciendo la
  // linea de presentaciones, que ya redondea para arriba.
  function litros(v) {
    return plural(num(v, 1), 'litro');
  }

  // ────────────────────────────────────────────────────────────────
  // ROUTER
  // ────────────────────────────────────────────────────────────────
  var app = document.getElementById('calcApp');
  var screen = 'menu';
  var lastResultado = null;
  var firstRender = true;

  function nav(to) {
    screen = to;
    render();
    if (!firstRender) {
      var y = document.getElementById('calculadora').getBoundingClientRect().top + window.pageYOffset - 80;
      window.scrollTo({ top: y, behavior: 'smooth' });

    firstRender = false;
  }

  function bar(kicker, titulo, back, n) {
    return '<div class="cl-bar">' +
      (back ? '<button class="cl-bar-back" type="button" data-nav="' + back + '" aria-label="Volver">' + ICO_BACK + '</button>' : '') +

      '</div>' +
      (n ? '<div class="cl-bar-n">' + n + '</div>' : '') +
    '</div>';
  }

  function panelH(n, txt) {

  }

  function opcion(id, label, infoKey) {
    return '<div class="cl-opt">' +
      '<label class="cl-opt-lb"><input type="checkbox" id="' + id + '"><span class="cl-opt-t">' + label + '</span></label>' +
      infoBtn(infoKey) +
    '</div>';
  }

  function acts(primary, primaryAction, secondary, secondaryAction) {
    var h = '<div class="cl-acts">' +
      '<button class="cl-btn cl-btn-p" type="button" data-act="' + primaryAction + '">' + primary + ICO_ARROW + '</button>';
    if (secondary) h += '<button class="cl-btn cl-btn-g" type="button" data-nav="' + secondaryAction + '">' + secondary + '</button>';
    return h + '</div>';
  }

  function render() {
    if (screen === 'menu') renderMenu();
    else if (screen === 'materiales') renderMateriales();
    else if (screen === 'proteccion') renderProteccion();
    else if (screen === 'reparacion') renderReparacion();
    else if (screen === 'resultadosMateriales') renderResultadosMateriales();
    else if (screen === 'resultadosProteccion') renderResultadosProteccion();
    else if (screen === 'resultadosReparacion') renderResultadosReparacion();
  }

  // ── MENÚ ──────────────────────────────────────────────────────────
  var ICO_MOD = {
    piso: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M12 2.6l9 4.9-9 4.9-9-4.9 9-4.9z"/><path d="M3 12.2l9 4.9 9-4.9"/><path d="M3 16.9l9 4.9 9-4.9"/></svg>',
    escudo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M12 2.5l8 3v6.2c0 5-3.4 8.6-8 9.8-4.6-1.2-8-4.8-8-9.8V5.5l8-3z"/><path d="M8.6 12.2l2.4 2.4 4.4-4.6"/></svg>',
    grieta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18"/><path d="M10 3l1.6 6-3.1 2.6L11 15l-1.6 6"/></svg>'
  };

  function renderMenu() {
    app.innerHTML =
      '<div class="cl-mast">' +
        '<div class="cl-eyebrow">Herramienta técnica</div>' +
        '<h1 class="cl-mast-h1">Calculadora <span class="red">de materiales</span></h1>' +
        '<p class="cl-mast-p">Elegí la etapa de tu obra, cargá los metros y obtené las cantidades exactas según la ficha técnica de cada producto.</p>' +
      '</div>' +
      '<div class="cl-mods">' +

        '<button class="cl-mod" type="button" data-nav="materiales">' +
          '<div class="cl-mod-top"><div class="cl-mod-ico">' + ICO_MOD.piso + '</div><div class="cl-mod-n">01</div></div>' +
          '<div><div class="cl-mod-t">Construcción<br>de piso</div>' +
          '<div class="cl-mod-d">Nylon, macrofibra, microfibra, endurecedor superficial, aditivo de llaneado, curador y juntas de dilatación.</div></div>' +
          '<span class="cl-mod-go">Calcular' + ICO_ARROW + '</span>' +
        '</button>' +

        '<button class="cl-mod" type="button" data-nav="proteccion">' +
          '<div class="cl-mod-top"><div class="cl-mod-ico">' + ICO_MOD.escudo + '</div><div class="cl-mod-n">02</div></div>' +
          '<div><div class="cl-mod-t">Fórmula<br>NC</div>' +
          '<div class="cl-mod-d">Protección y embellecimiento del hormigón: Concret Sodium, Concret Lock y Concret Finish.</div></div>' +
          '<span class="cl-mod-tag">Garantía 25 años</span>' +
          '<span class="cl-mod-go">Calcular' + ICO_ARROW + '</span>' +
        '</button>' +

        '<button class="cl-mod" type="button" data-nav="reparacion">' +
          '<div class="cl-mod-top"><div class="cl-mod-ico">' + ICO_MOD.grieta + '</div><div class="cl-mod-n">03</div></div>' +
          '<div><div class="cl-mod-t">Reparación<br>de superficies</div>' +
          '<div class="cl-mod-d">Grouting Concret Fix para rellenos de volumen y mortero Concret MicroStrong para bordes, poros y oquedades.</div></div>' +
          '<span class="cl-mod-go">Calcular' + ICO_ARROW + '</span>' +
        '</button>' +

      '</div>' +
      '<p class="cl-note">Los resultados son orientativos y están calculados con los rendimientos de ficha técnica de cada producto. Las cantidades reales pueden variar según la absorción del sustrato, el método de aplicación y las condiciones climáticas de la obra.</p>';
  }

  // ── MATERIALES (construcción de piso) ─────────────────────────────
  function renderMateriales() {
    app.innerHTML =
      bar('Módulo 01', 'Construcción de piso', 'menu', '01') +
      '<div class="cl-grid cl-grid--main">' +

        '<div class="cl-panel cl-panel--wide">' +
          panelH('01', 'Datos del piso') +
          '<label class="cl-lbl" for="m_m2">Superficie del piso</label>' +
          '<div class="cl-inp-w"><input type="number" id="m_m2" placeholder="Ej: 100" inputmode="decimal" min="0"><span class="u">m²</span></div>' +

          '<div class="cl-excl">' +
            '<div class="cl-excl-h"><span class="t">Espesor o volumen</span><span class="h">Completá uno · el otro se calcula solo</span></div>' +
            '<div class="cl-excl-row">' +
              '<div class="cl-excl-c" id="cell_esp">' +
                '<div class="cap"><span class="n">Espesor</span><span class="cl-auto">Auto</span></div>' +
                '<div class="cl-inp-w"><input type="number" id="m_esp" placeholder="Ej: 10" inputmode="decimal" min="0"><span class="u">cm</span></div>' +
              '</div>' +
              '<div class="cl-excl-or">Ó</div>' +
              '<div class="cl-excl-c" id="cell_m3">' +
                '<div class="cap"><span class="n">Volumen</span><span class="cl-auto">Auto</span></div>' +

              '</div>' +
            '</div>' +

        '</div>' +

        '<div class="cl-panel">' +
          panelH('03', 'Terminación y juntas') +
          opcion('m_dur', 'Concret Dur 100', 'dur') +
          opcion('m_juntas', 'Sellador de juntas', 'juntas') +
        '</div>' +

      '</div>' +
      acts('Calcular materiales', 'calcMateriales', 'Volver al menú', 'menu') +

    initPiso();

  function val(id) {
    var el = document.getElementById(id);
    if (!el) return null;
    var v = parseFloat(el.value);
    return isNaN(v) ? null : v;
  }
  function chk(id) { return document.getElementById(id).checked; }

  // ── Espesor ↔ m³ excluyentes ────────────────────────────────────
  // pisoSource guarda cuál de los dos campos cargó el usuario.
  // El otro queda en modo AUTO (solo lectura) y se recalcula solo.
  var pisoSource = null; // 'esp' | 'm3' | null

  function initPiso() {
    var m2El = document.getElementById('m_m2');
    var espEl = document.getElementById('m_esp');
    var m3El = document.getElementById('m_m3');

    pisoSource = null;

    espEl.addEventListener('input', function () {
      if (espEl.value.trim() === '') { pisoSource = null; m3El.value = ''; }
      else pisoSource = 'esp';
      syncPiso();
    });
    m3El.addEventListener('input', function () {
      if (m3El.value.trim() === '') { pisoSource = null; espEl.value = ''; }
      else pisoSource = 'm3';
      syncPiso();
    });
    m2El.addEventListener('input', syncPiso);

    // Si tocan el campo bloqueado, avisamos por qué no se puede editar.
    [['m_esp', 'esp'], ['m_m3', 'm3']].forEach(function (pair) {
      document.getElementById(pair[0]).addEventListener('mousedown', function () {
        if (pisoSource && pisoSource !== pair[1]) {
          toast(pair[1] === 'esp'
            ? 'El espesor se calcula solo. Borrá los m³ para editarlo.'
            : 'Los m³ se calculan solos. Borrá el espesor para editarlos.');
        }
      });
    });

    syncPiso();
  }

  function syncPiso() {
    var m2El = document.getElementById('m_m2');
    var espEl = document.getElementById('m_esp');
    var m3El = document.getElementById('m_m3');
    var cellEsp = document.getElementById('cell_esp');
    var cellM3 = document.getElementById('cell_m3');
    var note = document.getElementById('exclNote');
    if (!m2El || !espEl || !m3El) return;

    var m2 = parseFloat(m2El.value);
    var m2Ok = !isNaN(m2) && m2 > 0;

    cellEsp.classList.remove('is-auto');
    cellM3.classList.remove('is-auto');
    espEl.readOnly = false;
    m3El.readOnly = false;
    note.classList.remove('show');

    if (pisoSource === 'esp') {
      cellM3.classList.add('is-auto');
      m3El.readOnly = true;
      var esp = parseFloat(espEl.value);
      m3El.value = (m2Ok && !isNaN(esp)) ? parseFloat((m2 * esp / 100).toFixed(3)) : '';
      if (!m2Ok) note.classList.add('show');
    } else if (pisoSource === 'm3') {
      cellEsp.classList.add('is-auto');
      espEl.readOnly = true;
      var m3 = parseFloat(m3El.value);
      espEl.value = (m2Ok && !isNaN(m3)) ? parseFloat((m3 / m2 * 100).toFixed(2)) : '';
      if (!m2Ok) note.classList.add('show');
    }
  }

  function calcularMateriales() {
    var m2 = val('m_m2');
    var esp = val('m_esp'), m3 = val('m_m3');

    if (m2 === null || m2 <= 0) { toast('Ingresá los metros cuadrados del piso'); return; }
    if (esp === null && m3 === null) { toast('Ingresá el espesor (cm) o el volumen (m³)'); return; }
    if (m3 === null || pisoSource === 'esp') m3 = m2 * esp / 100;
    if (esp === null || pisoSource === 'm3') esp = m3 / m2 * 100;
    if (esp <= 0 || m3 <= 0) { toast('El espesor y el volumen deben ser mayores a cero'); return; }

    lastResultado = {
      m2: m2, m3: m3, esp: esp,
      macrofibra_kg: m3 * 2.5, macrofibra_bolsas: Math.ceil(m3 * 2.5 / 5),
      microfibra_kg: m3 * 0.6, microfibra_bolsas: Math.ceil(m3 * 0.6 / 0.6),
      dur_kg: m2 * 2, dur_bolsas: Math.ceil(m2 * 2 / 25),
      one_litros: m2 / 15, scudo_litros: m2 * 0.15,
      junta_min_m: (esp / 100) * 24, junta_max_m: (esp / 100) * 30, junta_prof_cm: esp / 4,
      juntas_cartuchos: chk('m_juntas') ? Math.ceil((2 * m2 / ((esp / 100) * 27)) / 10) : 0,
      usaMacrofibra: chk('m_macrofibra'), usaMicrofibra: chk('m_microfibra'),
      usaDur: chk('m_dur'), usaJuntas: chk('m_juntas')
    };
    nav('resultadosMateriales');
  }

  // ── Tarjetas de resultado ────────────────────────────────────────
  var resIdx = 0;

  // storeKey: omitido usa infoKey; null para las tarjetas que no son un
  // producto comprable (p. ej. la cuadrícula de juntas recomendada).
  function resultCard(titulo, valor, infoKey, storeKey) {
    resIdx++;
    var sk = storeKey === undefined ? infoKey : storeKey;
    var lineas = String(valor).split('\n');
    var sub = lineas.slice(1).filter(function (l) { return l !== ''; })
      .map(function (l) { return '<div class="cl-res-s">' + l + '</div>'; }).join('');
    var acts = (sk ? buyBtn(sk) : '') + (infoKey ? infoBtn(infoKey, 'Ficha técnica') : '');
    return '<div class="cl-res">' +
      '<div class="cl-res-n">' + (resIdx < 10 ? '0' : '') + resIdx + '</div>' +
      '<div class="cl-res-t">' + titulo + '</div>' +
      '<div class="cl-res-v">' + lineas[0] + '</div>' + sub +
      (acts ? '<div class="cl-res-acts">' + acts + '</div>' : '') +
    '</div>';
  }

  function chip(k, v, u) {
    return '<div class="cl-chip"><div class="k">' + k + '</div>' +
      '<div class="v">' + v + (u ? '<small>' + u + '</small>' : '') + '</div></div>';
  }

  function bidones(litros) {
    return 'Bidón 5 L: ' + Math.ceil(litros / 5) + 'u · Balde 10 L: ' + Math.ceil(litros / 10) +
      'u · Balde 20 L: ' + Math.ceil(litros / 20) + 'u';
  }

  function resActs(volverA) {
    return '<div class="cl-acts">' +
      '<button class="cl-btn cl-btn-p" type="button" data-act="wa">Pedir presupuesto' +
        '<svg viewBox="0 0 18 18" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M9 1.5C4.86 1.5 1.5 4.86 1.5 9c0 1.32.36 2.56.98 3.63L1.5 16.5l3.97-.97A7.47 7.47 0 009 16.5c4.14 0 7.5-3.36 7.5-7.5S13.14 1.5 9 1.5zm0 13.5c-1.13 0-2.2-.3-3.12-.82l-.22-.13-2.36.58.6-2.3-.14-.23A6 6 0 019 3a6 6 0 010 12z" fill="currentColor"></path></svg>' +
      '</button>' +
      '<button class="cl-btn cl-btn-g" type="button" data-nav="' + volverA + '">Recalcular</button>' +
      '<button class="cl-btn cl-btn-g" type="button" data-act="print">Imprimir / PDF</button>' +
      '<button class="cl-btn cl-btn-g" type="button" data-nav="menu">Volver al menú</button>' +
    '</div>';
  }

  function renderResultadosMateriales() {
    var r = lastResultado;
    resIdx = 0;
    var cards = resultCard('Nylon negro 200 micrones', num(r.m2, 1) + ' m²', 'nylon');
    if (r.usaMacrofibra) cards += resultCard('Macrofibra Concret Fibra',
      num(r.macrofibra_kg, 1) + ' kg\n' + plural(r.macrofibra_bolsas, 'bolsa') + ' de 5 kg', 'macrofibra');
    if (r.usaMicrofibra) cards += resultCard('Microfibra',
      num(r.microfibra_kg, 1) + ' kg\n' + plural(r.microfibra_bolsas, 'bolsa') + ' de 600 g', 'microfibra');
    if (r.usaDur) cards += resultCard('Concret Dur 100',
      num(r.dur_kg, 1) + ' kg\n' + plural(r.dur_bolsas, 'bolsa') + ' de 25 kg', 'dur');
    cards += resultCard('Concret One · llaneado',
      litros(r.one_litros) + '\n' + bidones(r.one_litros), 'one');
    cards += resultCard('Concret Scudo · curado',
      litros(r.scudo_litros) + '\n' + bidones(r.scudo_litros), 'scudo');
    if (r.usaJuntas) {
      cards += resultCard('Cuadrícula de juntas',
        'Cortes cada ' + num(r.junta_min_m, 1) + ' – ' + num(r.junta_max_m, 1) + ' m\n' +
        'Profundidad de corte: ' + num(r.junta_prof_cm, 1) + ' cm\n' +
        'Momento de corte: entre 6 y 24 h del colado\n' +
        'Cortá siempre en esquinas y junto a columnas o muros', 'juntas', null);
      if (r.juntas_cartuchos > 0) cards += resultCard('Sellador poliuretano',
        plural(r.juntas_cartuchos, 'cartucho') + '\nCartuchos de 600 ml', 'juntas');
    }

    app.innerHTML =
      bar('Módulo 01 · Resultado', 'Materiales necesarios', 'materiales', '01') +
      '<div class="cl-chips">' +
        chip('Superficie', num(r.m2, 1), 'm²') +
        chip('Espesor', num(r.esp, 1), 'cm') +
        chip('Volumen', num(r.m3, 2), 'm³') +
      '</div>' +
      '<div class="cl-sec-h">Materiales de obra</div>' +
      '<div class="cl-res-grid">' + cards + '</div>' +
      resActs('materiales') +
      '<p class="cl-note">Cantidades orientativas según ficha técnica. No incluyen desperdicio de obra ni solapes: sumá un margen del 5 al 10 % para cortes, empalmes y absorción del sustrato.</p>';
  }

  // ── PROTECCIÓN (Fórmula NC · So+Lo+Fi) ───────────────────────────
  function renderProteccion() {
    app.innerHTML =
      bar('Módulo 02', 'Fórmula NC', 'menu', '02') +
      '<div class="cl-grid cl-grid--duo">' +

        '<div class="cl-panel">' +
          panelH('01', 'Superficie a tratar') +
          '<label class="cl-lbl" for="p_m2">Metros cuadrados del piso</label>' +
          '<div class="cl-inp-w"><input type="number" id="p_m2" placeholder="Ej: 100" inputmode="decimal" min="0"><span class="u">m²</span></div>' +
          '<p class="cl-note" style="margin-top:1.2rem">El sistema completo entrega 25 años de garantía extensibles de por vida con el mantenimiento correspondiente.</p>' +
        '</div>' +

        '<div class="cl-panel">' +
          panelH('02', 'Productos del sistema') +
          opcion('p_sodium', 'Paso 1 — Concret Sodium', 'sodium') +
          opcion('p_lock', 'Paso 2 — Concret Lock', 'lock') +
          opcion('p_finish', 'Paso 3 — Concret Finish', 'finish') +
        '</div>' +

      '</div>' +
      acts('Calcular materiales', 'calcProteccion', 'Volver al menú', 'menu');
  }

  function calcularProteccion() {
    var m2 = val('p_m2');
    if (m2 === null || m2 <= 0) { toast('Ingresá los metros cuadrados'); return; }
    if (!chk('p_sodium') && !chk('p_lock') && !chk('p_finish')) { toast('Seleccioná al menos un producto'); return; }
    lastResultado = {
      m2: m2, sodium_litros: m2 / 10, lock_litros: m2 / 15, finish_litros: m2 / 15,
      usaSodium: chk('p_sodium'), usaLock: chk('p_lock'), usaFinish: chk('p_finish')
    };
    nav('resultadosProteccion');
  }

  function renderResultadosProteccion() {
    var r = lastResultado;
    resIdx = 0;
    var cards = '';
    if (r.usaSodium) cards += resultCard('Paso 1 · Concret Sodium',
      litros(r.sodium_litros) + '\n' + bidones(r.sodium_litros), 'sodium');
    if (r.usaLock) cards += resultCard('Paso 2 · Concret Lock',
      litros(r.lock_litros) + '\n' + bidones(r.lock_litros), 'lock');
    if (r.usaFinish) cards += resultCard('Paso 3 · Concret Finish',
      litros(r.finish_litros) + '\n' + bidones(r.finish_litros), 'finish');

    app.innerHTML =
      bar('Módulo 02 · Resultado', 'Materiales necesarios', 'proteccion', '02') +
      '<div class="cl-chips">' + chip('Superficie', num(r.m2, 1), 'm²') + '</div>' +
      '<div class="cl-sec-h">Productos del sistema</div>' +
      '<div class="cl-res-grid">' + cards + '</div>' +
      resActs('proteccion') +
      '<p class="cl-note">Rendimientos de ficha técnica sobre hormigón pulido y limpio. En pisos muy porosos o con desgaste, el consumo del densificador puede aumentar hasta un 20 %.</p>';
  }

  // ── REPARACIÓN (Fix + MicroStrong) ───────────────────────────────
  function renderReparacion() {
    app.innerHTML =
      bar('Módulo 03', 'Reparación de superficies', 'menu', '03') +
      '<div class="cl-grid cl-grid--duo">' +

        '<div class="cl-panel">' +
          panelH('01', 'Concret Fix · grouting') +
          opcion('r_fix', 'Usar Concret Fix', 'fix') +
          '<div class="cl-sub" id="fixFields" style="display:none">' +
            '<label class="cl-lbl" for="r_fix_area">Área a reparar</label>' +
            '<div class="cl-inp-w"><input type="number" id="r_fix_area" placeholder="Ej: 5" inputmode="decimal" min="0"><span class="u">m²</span></div>' +
            '<label class="cl-lbl" for="r_fix_prof">Profundidad de relleno</label>' +
            '<div class="cl-inp-w"><input type="number" id="r_fix_prof" placeholder="Ej: 15" inputmode="decimal" min="0"><span class="u">mm</span></div>' +
          '</div>' +
        '</div>' +

        '<div class="cl-panel">' +
          panelH('02', 'Concret MicroStrong · mortero') +
          opcion('r_ms', 'Usar MicroStrong', 'microstrong') +
          '<div class="cl-sub" id="msFields" style="display:none">' +
            '<label class="cl-lbl" for="r_ms_area">Área</label>' +
            '<div class="cl-inp-w"><input type="number" id="r_ms_area" placeholder="Ej: 20" inputmode="decimal" min="0"><span class="u">m²</span></div>' +
            '<label class="cl-lbl" for="r_ms_esp">Espesor</label>' +
            '<div class="cl-inp-w"><input type="number" id="r_ms_esp" placeholder="Ej: 3" inputmode="decimal" min="0"><span class="u">mm</span></div>' +
          '</div>' +
        '</div>' +

      '</div>' +
      acts('Calcular materiales', 'calcReparacion', 'Volver al menú', 'menu');

    document.getElementById('r_fix').addEventListener('change', function (e) {
      document.getElementById('fixFields').style.display = e.target.checked ? 'block' : 'none';
    });
    document.getElementById('r_ms').addEventListener('change', function (e) {
      document.getElementById('msFields').style.display = e.target.checked ? 'block' : 'none';
    });
  }

  function calcularReparacion() {
    var usaFix = chk('r_fix'), usaMicroStrong = chk('r_ms');
    if (!usaFix && !usaMicroStrong) { toast('Seleccioná al menos un producto'); return; }

    var r = { usaFix: usaFix, usaMicroStrong: usaMicroStrong };

    if (usaFix) {
      var areaF = val('r_fix_area'), prof = val('r_fix_prof');
      if (areaF === null || prof === null) { toast('Completá área y profundidad para Concret Fix'); return; }
      var vol = areaF * prof; // 1 m² x 1 mm = 1 L
      r.fix_litros = vol;
      r.fix_bolsas25 = Math.ceil(vol / 15); // rinde 15 L por bolsa de 25 kg
    }
    if (usaMicroStrong) {
      var areaM = val('r_ms_area'), esp = val('r_ms_esp');
      if (areaM === null || esp === null) { toast('Completá área y espesor para MicroStrong'); return; }
      // Rendimiento promedio entre Fino (1,9) y Grueso (2,1) kg/m² por mm.
      var kg = areaM * esp * 2.0;
      r.ms_kg = kg;
      r.ms_bolsas10 = Math.ceil(kg / 10);
    }

    lastResultado = r;
    nav('resultadosReparacion');
  }

  function renderResultadosReparacion() {
    var r = lastResultado;
    resIdx = 0;
    var cards = '';
    if (r.usaFix) cards += resultCard('Concret Fix · grouting',
      num(r.fix_litros, 1) + ' L a rellenar\n' + plural(r.fix_bolsas25, 'bolsa') + ' de 25 kg', 'fix');
    if (r.usaMicroStrong) cards += resultCard('Concret MicroStrong · mortero',
      num(r.ms_kg, 1) + ' kg\n' + plural(r.ms_bolsas10, 'bolsa') + ' de 10 kg', 'microstrong');

    app.innerHTML =
      bar('Módulo 03 · Resultado', 'Materiales de reparación', 'reparacion', '03') +
      '<div class="cl-sec-h">Productos de reparación</div>' +
      '<div class="cl-res-grid">' + cards + '</div>' +
      resActs('reparacion') +
      '<p class="cl-note">El rendimiento de MicroStrong se calcula con el promedio entre la versión Fina (1,9 kg/m² por mm) y la Gruesa (2,1 kg/m² por mm). Consultá la ficha para elegir la versión según el espesor.</p>';
  }

  // ── Presupuesto por WhatsApp ─────────────────────────────────────
  function pedirPresupuesto() {
    var titulo = app.querySelector('.cl-bar-t');
    var lineas = ['Hola NewConcret, calculé mis materiales en la web y necesito un presupuesto.'];
    lineas.push('');
    lineas.push((titulo ? titulo.textContent : 'Cálculo') + ':');

    app.querySelectorAll('.cl-chip').forEach(function (c) {
      lineas.push('· ' + c.querySelector('.k').textContent + ': ' + c.querySelector('.v').textContent.trim());
    });
    lineas.push('');

    app.querySelectorAll('.cl-res').forEach(function (c) {
      var t = c.querySelector('.cl-res-t').textContent;
      var v = c.querySelector('.cl-res-v').textContent;
      var subs = [].map.call(c.querySelectorAll('.cl-res-s'), function (s) { return s.textContent; });
      lineas.push('· ' + t + ': ' + v + (subs.length ? ' (' + subs.join(' · ') + ')' : ''));
    });

    window.open('https://wa.me/5492342464082?text=' + encodeURIComponent(lineas.join('\n')), '_blank', 'noopener');
  }

  // ── Delegación de eventos ────────────────────────────────────────
  app.addEventListener('click', function (e) {
    var navBtn = e.target.closest('[data-nav]');
    if (navBtn) { nav(navBtn.getAttribute('data-nav')); return; }

    var infoEl = e.target.closest('[data-info]');
    if (infoEl) { showInfo(infoEl.getAttribute('data-info')); return; }

    var actEl = e.target.closest('[data-act]');
    if (!actEl) return;
    var act = actEl.getAttribute('data-act');
    if (act === 'calcMateriales') calcularMateriales();
    else if (act === 'calcProteccion') calcularProteccion();
    else if (act === 'calcReparacion') calcularReparacion();
    else if (act === 'wa') pedirPresupuesto();
    else if (act === 'print') window.print();
  });

  render();
  firstRender = false;

  // ── Reveal on scroll ─────────────────────────────────────────────
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.cl-reveal').forEach(function (el) { io.observe(el); });
})();
</script>
</body>
</html>
