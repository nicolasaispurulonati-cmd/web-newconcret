            letter-spacing: 0.18em;

            align-items: center;
            gap: 0.6rem;
            transition: background .35s var(--expo), color .35s var(--expo), border-color .35s var(--expo);
        }

        .nf-btn svg { width: 15px; height: 15px; }

        .nf-btn-primary {

        .nf-btn-ghost {

        .nf-links {

        .nf-links-lbl {

            letter-spacing: 0.25em;
            color: var(--nc-red-hot);
            font-weight: 500;
            display: block;
            margin-bottom: 1.4rem;
        }

        .nf-links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1px;
            background: var(--nc-steel);
            border: 1px solid var(--nc-steel);
        }

        .nf-link-card {
            background: var(--nc-black);
            padding: 1.6rem 1.5rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: background .35s var(--expo);
        }

        .nf-link-card:hover { background: var(--nc-dark); }

        .nf-link-name {
            font-family: var(--font-d);
            font-weight: 900;
            font-size: 1.15rem;
            text-transform: uppercase;
            color: var(--nc-white);
            letter-spacing: -0.01em;

        .nf-link-card:hover svg { color: var(--nc-red-hot); }
